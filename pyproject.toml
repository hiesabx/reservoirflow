[project]
name = "reservoirflow"
dynamic = ["version"]
description = "Reservoir Simulation and Engineering Library in Python"
readme = "README.md"
requires-python = ">=3.11"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]
authors = [{ name = "Hiesab", email = "contact@hiesab.com" }]
maintainers = [{ name = "Zakariya Abugrin", email = "zakariya.abugrin@hiesab.com" }]
keywords = ["Petroleum", "Reservoir", "Simulation", "Scientific Computing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiohttp>=3.11.11",
    "ipywidgets>=8.1.6",
    "line-profiler>=4.2.0",
    "matplotlib>=3.10.0",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "pyvista[jupyter]>=0.45.0",
    "scipy>=1.14.1",
    "sympy>=1.13.1",
    "tabulate>=0.9.0",
    "torch>=2.6.0",
    "tqdm>=4.67.1",
    "trame>=3.9.0",
]

[project.urls]
Website = "https://www.hiesab.com/en/products/reservoirflow/"
Documentation = "https://reservoirflow.hiesab.com/"
GitHub = "https://github.com/hiesabx/reservoirflow"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.0",
    "torch>=2.7.0",
    "seaborn",
]

[tool.ruff]
target-version = "py311"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "reservoirflow.__version__"}

[tool.setuptools.packages.find]
include = ["reservoirflow*"]
